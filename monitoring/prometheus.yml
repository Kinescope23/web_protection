global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Метрики самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Метрики хоста (CPU, RAM, диск, сеть)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Метрики backend (FastAPI + slowapi)
  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
    scrape_interval: 10s

  # Метрики Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']