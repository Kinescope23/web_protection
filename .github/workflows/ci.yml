name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/net-protector
  VERSION: ${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}

jobs:
  # === 1. Линтинг и тесты с покрытием ===
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python backend
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest flake8 black pytest-cov

      - name: Lint Python code
        run: |
          cd backend
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          black --check app/ || true

      - name: Run Python tests with coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing tests/ || echo "No tests found"

      - name: Upload Python coverage to SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend/coverage.xml

      # Node frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          cd frontend
          npm ci

      
      - name: Run frontend tests with coverage
        run: |
          cd frontend
          npm run test:coverage|| echo "No tests found"


      - name: Upload frontend coverage to SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

      # Go agent
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: agent/go.sum

      - name: Lint Go code
        run: |
          cd agent
          go mod download
          go vet ./...
          gofmt -s -w .

      - name: Run Go tests with coverage
        run: |
          cd agent
          go test -v -coverprofile=coverage.out ./... || echo "No tests found"
          go tool cover -func=coverage.out || true

      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: agent/coverage.out

  # === 2. Сканирование безопасности Docker (Trivy) ===
  trivy-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate dummy SSL certificates for CI
        run: |
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout nginx/ssl/privkey.pem \
            -out nginx/ssl/fullchain.pem \
            -subj "/CN=localhost"

      - name: Build Docker images for scanning
        run: |
          docker build -t net-protector-backend:latest ./backend
          docker build -t net-protector-frontend:latest ./frontend
          docker build -t net-protector-agent:latest ./agent

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'net-protector-backend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'net-protector-frontend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'

      - name: Scan agent image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'net-protector-agent:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'

  # === 3. SAST анализ (SonarQube) ===
  sonarqube:
    runs-on: ubuntu-latest
    needs: [lint-and-test, trivy-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: backend/

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=backend/app,frontend/src,agent/cmd
            -Dsonar.tests=backend/tests,frontend/src/__tests__,agent/cmd
            -Dsonar.python.version=3.11
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.go.coverage.reportPaths=agent/coverage.out

  # === 4. Сборка и публикация Docker образов ===
  build-and-push:
    runs-on: ubuntu-latest
    needs: [trivy-scan, sonarqube]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_IMAGE }}-backend:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_IMAGE }}-frontend:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agent
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          push: true
          tags: ${{ env.DOCKER_IMAGE }}-agent:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # === 5. Создание релиза (только для тега) ===
  create-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false