version: '3.8'

services:
  # === База данных ===
  db:
    image: postgres:15-alpine
    container_name: np-db
    environment:
      POSTGRES_USER: ${DB_USER:-np_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-np_password}
      POSTGRES_DB: ${DB_NAME:-np_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-np_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Backend (FastAPI) ===
  backend:
    build: ./backend
    container_name: np-backend
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-np_user}:${DB_PASSWORD:-np_password}@db:5432/${DB_NAME:-np_db}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-32-chars-min}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - ./uploads:/app/uploads
      - ./backend/app/ml/ml_models:/app/ml_models:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  # === Frontend (React) ===
  frontend:
    build: ./frontend
    container_name: np-frontend
    networks:
      - app_network
    restart: unless-stopped

  # === Nginx (Reverse Proxy) ===
  nginx:
    build: ./nginx
    container_name: np-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network
    restart: unless-stopped

  # === Go Agent ===
  agent:
    build: ./agent
    container_name: np-agent
    environment:
      - SERVER_URL=http://backend:8000
      - AGENT_ID=${AGENT_ID:-agent-001}
    ports:
      - "8080:8080"
    networks:
      - app_network
    restart: unless-stopped

  # === Мониторинг: Prometheus ===
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: np-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    networks:
      - app_network
    restart: unless-stopped

  # === Мониторинг: Node Exporter ===
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: np-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - app_network
    restart: unless-stopped

  # === Мониторинг: Nginx Exporter ===
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: np-nginx-exporter
    command:
      - '--nginx.scrape-uri=http://nginx:80/nginx_status'
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - app_network
    restart: unless-stopped

  # === Мониторинг: Grafana ===
  grafana:
    image: grafana/grafana:10.4.1
    container_name: np-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  app_network:
    driver: bridge