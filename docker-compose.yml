version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: np-db
    environment:
      POSTGRES_USER: np_user
      POSTGRES_PASSWORD: np_pass
      POSTGRES_DB: np_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U np_user -d np_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  backend:
    build: ./backend
    container_name: np-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://np_user:np_pass@db:5432/np_db
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - backend-net

  frontend:
    build: ./frontend
    container_name: np-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - backend-net

  nginx:
    build: ./nginx
    container_name: np-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - backend-net

  prometheus:
    image: prom/prometheus:latest
    container_name: np-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:latest
    container_name: np-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend-net

volumes:
  postgres_data:

networks:
  backend-net:
    driver: bridge