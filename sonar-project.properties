sonar.projectKey=Kinescope23_web_protection
sonar.organization=kinescope23

# Источники кода
sonar.sources=backend/app,frontend/src,agent/cmd

# Указываем, где лежат тесты (это важно для расчета Coverage on New Code)
sonar.tests=frontend/src,backend/app

# Исключаем из анализа кода зависимости и сборки
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/dist/**,**/build/**,**/venv/**

# Явно указываем, какие файлы считать тестами (чтобы они не попадали в метрики "запахов кода", но учитывались в покрытии)
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**/*.py

# Python (убедитесь, что ваш CI генерирует coverage.xml именно в папке backend)
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml

# JavaScript/TypeScript (ИСПРАВЛЕНО: добавлен префикс frontend/)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Кодировка
sonar.sourceEncoding=UTF-8